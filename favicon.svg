    <path d="M 8 32 L 16 32 C 16 28 18 26 21 26 C 24 26 26 28 26 32 L 32 32 L 32 40 C 36 40 38 42 38 45 C 38 48 36 50 32 50 L 32 56 L 8 56 Z" fill="#00bcd4"/>
    
    <!-- Peça 4: Vermelho (Inferior Direita) -->
    <path d="M 32 32 L 40 32 C 40 36 42 38 45 38 C 48 38 50 36 50 32 L 56 32 L 56 56 L 32 56 L 32 50 C 36 50 38 48 38 45 C 38 42 36 40 32 40 Z" fill="#e53935"/>
